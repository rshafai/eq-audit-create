# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: gc.agr.aafc.mm.eqauditcreate
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: TMQ
          url: https://tmqpas01.agr.gc.ca:44333/
          client: '100'
        app:
          name: zqmm_eq_audcr
          description: Equipment Audit Create
          package: zqmm_eq_audit
          transport: TMQK900331
        exclude:
          - /test/
        credentials:
          username: env:XYZ_USER
          password: env:XYZ_PASSWORD
